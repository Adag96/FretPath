[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fretpath"
version = "0.0.1"
description = "Knowledge-based agent that sequences guitar fingerings for a chord progression."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
